name: frontend
description: "WhyWait - Real-time taxi tracking platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ===== MAPS & LOCATION =====
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  location: ^5.0.0
  permission_handler: ^11.0.0

  # ===== GRPC =====
  grpc: ^5.1.0
  protobuf: ^6.0.0

  # ===== HTTP & NETWORK =====
  http: ^1.6.0

  # ===== NAVIGATION =====
  go_router: ^17.5.0

  # ===== STORAGE =====
  shared_preferences: ^2.5.5

  # ===== UI =====
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true