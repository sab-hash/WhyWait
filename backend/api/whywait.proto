syntax = "proto3";

package whywait;

option go_package = "whywait-backend/api";

// ============================================================
// SERVICES
// ============================================================

service TaxiService {
  // ===== AUTH =====
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);

  // ===== PASSENGER =====
  rpc GetTerminals (Empty) returns (TerminalsResponse);
  rpc GetPopularRoutes (Empty) returns (PopularRoutesResponse);
  rpc GetTaxiStatus (Empty) returns (TaxiStatusResponse);

  // ===== REAL-TIME TRACKING (Server Streaming) =====
  rpc TrackTaxis (TrackRequest) returns (stream TaxiUpdate);

  // ===== DRIVER =====
  rpc UpdateLocation (LocationUpdate) returns (LocationResponse);
  rpc UpdateDriverStatus (DriverStatusRequest) returns (DriverStatusResponse);

  // ===== ASSIGNED TAXIS =====
  rpc GetAssignedTaxis (AssignedTaxisRequest) returns (AssignedTaxisResponse);
}

// ============================================================
// MESSAGES
// ============================================================

// ----- EMPTY -----
message Empty {}

// ----- AUTH -----
message RegisterRequest {
  string full_name = 1;
  string phone = 2;
  string email = 3;
  string password = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  bool success = 1;
  string token = 2;
  User user = 3;
}

message User {
  string id = 1;
  string full_name = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
}

// ----- PASSENGER -----
message Terminal {
  string id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  string address = 5;
  string city = 6;
}

message TerminalsResponse {
  bool success = 1;
  repeated Terminal terminals = 2;
}

message PopularRoute {
  string from = 1;
  string to = 2;
  int32 wait_time = 3;
}

message PopularRoutesResponse {
  bool success = 1;
  repeated PopularRoute routes = 2;
}

message TaxiStatusResponse {
  bool success = 1;
  int32 available = 2;
  int32 total = 3;
  int32 average_wait = 4;
  int32 nearby_stations = 5;
}

// ----- REAL-TIME TRACKING -----
message TrackRequest {
  string station = 1;
}

message TaxiUpdate {
  string taxi_id = 1;
  string plate = 2;
  string driver_name = 3;
  string status = 4;
  double latitude = 5;
  double longitude = 6;
  double distance_km = 7;
  int32 eta_minutes = 8;
  string station = 9;
}

// ----- DRIVER -----
message LocationUpdate {
  string taxi_id = 1;
  double latitude = 2;
  double longitude = 3;
  double speed = 4;
  double heading = 5;
}

message LocationResponse {
  bool success = 1;
  string message = 2;
}

message DriverStatusRequest {
  string taxi_id = 1;
  bool is_online = 2;
}

message DriverStatusResponse {
  bool success = 1;
  string message = 2;
}

// ----- ASSIGNED TAXIS -----
message AssignedTaxisRequest {
  string terminal_id = 1;
}

message AssignedTaxiInfo {
  string taxi_id = 1;
  string plate = 2;
  string driver_name = 3;
  string status = 4;
  double latitude = 5;
  double longitude = 6;
  double distance_km = 7;
  int32 eta_minutes = 8;
}

message AssignedTaxisResponse {
  repeated AssignedTaxiInfo taxis = 1;
}